name: iwebcam
options:
  bundleIdPrefix: com.lucas.iwebcam
  deploymentTarget:
    iOS: "17.0"
targets:
  iwebcam:
    type: application
    platform: iOS
    sources: [Sources/iwebcam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.iwebcam
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "iwebcam usa la cámara para transmitirla como webcam."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "iwebcam necesita acceso a la red local para conectarse con la PC."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  iwebcamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/iwebcamTests]
    dependencies:
      - target: iwebcam
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iwebcam:
    build:
      targets:
        iwebcam: all
        iwebcamTests: [test]
    test:
      targets: [iwebcamTests]
